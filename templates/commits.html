<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Commits — {{ meta.name }}</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; color: #222; }
    table { border-collapse: collapse; margin-top: 1rem; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 0.35rem 0.6rem; text-align: left; }
    th { background: #f4f4f4; }
    a { color: #0b5fff; }
  </style>
</head>
<body>
  <nav><a href="{{ url_for('repo_view', repo_id=repo_id) }}">&larr; {{ meta.name }} dashboard</a></nav>
  <h1>Commits</h1>
  <table>
    <tr><th>SHA</th><th>Committer date (unix)</th><th>Author</th><th>Files changed</th><th></th></tr>
    {% for c in commits %}
    <tr>
      <td>{{ c.sha[:10] }}</td>
      <td>{{ c.committer_date }}</td>
      <td>{{ c.author }}</td>
      <td>{{ c.changes|length }}</td>
      <td><a href="{{ url_for('repo_commit_detail', repo_id=repo_id, sha=c.sha) }}">metrics</a></td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
