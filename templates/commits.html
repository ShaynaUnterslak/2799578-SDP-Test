<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Commits — {{ meta.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="{{ url_for('index') }}">RAT</a>
    <div class="breadcrumbs">
      <a href="{{ url_for('index') }}">Home</a>
      <span class="sep">/</span>
      <a href="{{ url_for('repo_view', repo_id=repo_id) }}">{{ meta.name }}</a>
      <span class="sep">/</span>
      <span class="current">Commits</span>
    </div>
  </nav>
  <div class="page">
  <h1>Commits</h1>
  <p class="subtitle">{{ commits|length }} non-merge commit(s) reachable from the reference commit.</p>
  <table>
    <tr><th>SHA</th><th>Committer date (unix)</th><th>Author</th><th>Files changed</th><th></th></tr>
    {% for c in commits %}
    <tr>
      <td><code>{{ c.sha[:10] }}</code></td>
      <td>{{ c.committer_date }}</td>
      <td>{{ c.author }}</td>
      <td>{{ c.changes|length }}</td>
      <td><a href="{{ url_for('repo_commit_detail', repo_id=repo_id, sha=c.sha) }}">metrics &rarr;</a></td>
    </tr>
    {% endfor %}
  </table>
  </div>
</body>
</html>
